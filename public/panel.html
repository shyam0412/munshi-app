<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Munshi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6F9; --surface:#FFFFFF; --ink:#101B3D; --ink2:#4A5578; --ink3:#7B85A3; --rule:#DCE1EB; --wash:#E9EDF4;
  --loss:#B42318; --loss2:#F0A199; --mid:#A9B1C6; --gain3:#8FD3B6; --gain2:#2FA37A; --gain:#0B6B4B;
  --warn:#A8690B; --focus:#3457D5; --bar:#2B3E86; --bar-soft:#C9D1E6;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --text:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1224; --surface:#151B33; --ink:#EEF1F8; --ink2:#B3BBD3; --ink3:#8690AE; --rule:#28304F; --wash:#1D2440;
  --loss:#FF7A6B; --loss2:#A9483E; --mid:#59628A; --gain3:#2F7F68; --gain2:#3FC293; --gain:#B4F0D8;
  --warn:#F0B347; --focus:#8FA8FF; --bar:#8FA3EC; --bar-soft:#2E3860;
}}
:root[data-theme="dark"]{
  --paper:#0D1224; --surface:#151B33; --ink:#EEF1F8; --ink2:#B3BBD3; --ink3:#8690AE; --rule:#28304F; --wash:#1D2440;
  --loss:#FF7A6B; --loss2:#A9483E; --mid:#59628A; --gain3:#2F7F68; --gain2:#3FC293; --gain:#B4F0D8;
  --warn:#F0B347; --focus:#8FA8FF; --bar:#8FA3EC; --bar-soft:#2E3860;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.5 var(--text);-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule);background:var(--surface);position:sticky;top:0;z-index:5}
.mark{font:650 17px/1 var(--display);letter-spacing:-.01em}
.site{color:var(--ink3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.seg{display:flex;background:var(--wash);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:5px 9px;border-radius:6px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--rule)}
.x{border:0;background:none;width:30px;height:30px;border-radius:6px;font-size:20px;line-height:1;color:var(--ink2);flex:none}
.x:hover{background:var(--wash)}

main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:0 16px 24px}
.cols{display:block}
@media (min-width:900px){.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px}main{padding:0 28px 32px}}
section{padding:22px 0;border-bottom:1px solid var(--rule)}
section:last-child{border-bottom:0}
h2{font:600 13px/1.3 var(--text);color:var(--ink2);margin:0 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2 small{font:400 12px var(--text);color:var(--ink3)}

.sample{margin:14px 0 0;padding:9px 12px;background:var(--wash);border-radius:8px;font-size:12.5px;color:var(--ink2);display:flex;gap:10px;align-items:center;justify-content:space-between}
.link{background:none;border:0;padding:0;color:var(--focus);font-weight:500;text-decoration:underline;text-underline-offset:2px}

.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);margin-bottom:10px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gain2)}
.dot.on{animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gain2) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
@media (prefers-reduced-motion:reduce){.dot.on{animation:none}}
.headline{font:650 27px/1.14 var(--display);letter-spacing:-.022em;margin:0 0 16px;text-wrap:balance}
@media (min-width:900px){.headline{font-size:36px}}

.strip{display:flex;gap:2px;height:30px;border-radius:5px;overflow:hidden;margin-bottom:12px}
.strip i{display:block;min-width:3px;height:100%}
.fq{background:var(--loss)}.fg{background:var(--loss2)}.fb{background:var(--mid)}.fi{background:var(--gain3)}.fs{background:var(--gain2)}.fp{background:var(--gain)}
.fates{list-style:none;margin:0;padding:0}
.fates li{display:grid;grid-template-columns:14px 1fr auto 44px;gap:8px;align-items:center;padding:5px 0;font-size:13.5px}
.fates li.zero{color:var(--ink3)}
.sw{width:10px;height:10px;border-radius:2px}
.fates b{font-weight:600}
.fates span.p{color:var(--ink3);text-align:right;font-size:12.5px}

.read{margin:16px 0 0;padding:12px 14px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;font-size:14px;line-height:1.55;white-space:pre-line}
.read .by{display:block;font-size:12px;color:var(--ink3);margin-bottom:4px}
.lines{margin:14px 0 0;padding:0;list-style:none;color:var(--ink2)}
.lines li{padding:2px 0}

.issue{border-top:1px solid var(--rule)}
.issue:first-of-type{border-top:0}
.issue>button{display:grid;grid-template-columns:4px 1fr auto;gap:12px;width:100%;text-align:left;background:none;border:0;padding:12px 0;align-items:stretch}
.sev{border-radius:2px;background:var(--mid)}
.s3 .sev{background:var(--loss)}.s2 .sev{background:var(--warn)}
.issue .t{font-weight:600;font-size:14px;line-height:1.35}
.issue .n{font-size:12px;color:var(--ink3);white-space:nowrap;padding-top:2px}
.issue .tag{display:block;font-size:12px;font-weight:400;color:var(--ink3);margin-top:3px}
.body{padding:0 0 14px 16px;font-size:13.5px;color:var(--ink2)}
.body p{margin:0 0 10px}
.fix{background:var(--wash);border-radius:8px;padding:10px 12px;color:var(--ink);margin-bottom:10px}
.fix b{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:2px}
.ev{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ev span{font-size:12px;border:1px solid var(--rule);border-radius:999px;padding:2px 9px;color:var(--ink2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:14px;flex-wrap:wrap}
.clear{color:var(--ink2);display:flex;gap:10px;align-items:center}
.clear .dot{background:var(--gain2)}

.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 16px;margin-bottom:14px}
.kv div b{display:block;font:650 22px/1.1 var(--display);letter-spacing:-.01em}
.kv div span{font-size:12.5px;color:var(--ink3)}
.mini{list-style:none;margin:0 0 10px;padding:0;font-size:13px}
.mini li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px solid var(--rule)}
.mini li:first-child{border-top:0}
.mini .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap{font-size:12.5px;color:var(--ink3);margin:10px 0 4px}

.chart{display:flex;align-items:flex-end;gap:2px;height:96px;border-bottom:1px solid var(--rule);padding-top:10px}
.chart .c{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;min-width:0}
.chart .c i{display:block;width:100%;max-width:26px;background:var(--bar);border-radius:4px 4px 0 0;min-height:0}
.chart .c.f i{background:var(--bar-soft);height:2px!important;border-radius:0}
.chart .c:hover i{filter:brightness(1.25)}
.chart .c u{position:absolute;top:0;width:6px;height:6px;border-radius:50%;background:var(--gain2)}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);padding-top:5px}
.key{font-size:12px;color:var(--ink3);margin-top:6px;display:flex;align-items:center;gap:6px}
.key u{width:6px;height:6px;border-radius:50%;background:var(--gain2);display:inline-block}

table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:500;color:var(--ink3);text-align:right;font-size:12px;padding:0 0 6px 10px;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
td{padding:7px 0 7px 10px;border-top:1px solid var(--rule);text-align:right;white-space:nowrap}
td:first-child{max-width:0;width:99%;overflow:hidden;text-overflow:ellipsis}
td.bad{color:var(--loss);font-weight:600}
td.good{color:var(--gain2);font-weight:600}

.ask{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--rule);padding:10px 16px 12px;z-index:4}
.ask .in{max-width:1064px;margin:0 auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--rule);background:none;border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink2)}
.chips button:hover{background:var(--wash)}
.ask form{display:flex;gap:8px}
.ask input{flex:1;min-width:0;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:9px;padding:9px 12px;font:inherit}
.ask input::placeholder{color:var(--ink3)}
.send{border:0;background:var(--ink);color:var(--paper);border-radius:9px;padding:0 16px;font-weight:600}
.send:disabled{opacity:.5;cursor:default}
.chat .q{font-weight:600;margin:14px 0 4px}
.chat .a{white-space:pre-line;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:11px 13px}
.chat .a.wait{color:var(--ink3)}
.chat .note{font-size:12.5px;color:var(--ink3);margin:0 0 6px}

.center{max-width:420px;margin:12vh auto 0;padding:0 20px}
.center h1{font:650 28px/1.15 var(--display);letter-spacing:-.02em;margin:0 0 10px}
.center p{color:var(--ink2);margin:0 0 16px}
.center input{width:100%;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:9px;padding:10px 12px;font:inherit;margin-bottom:10px}
.btn{display:inline-block;border:0;background:var(--ink);color:var(--paper);border-radius:9px;padding:10px 16px;font-weight:600;text-decoration:none}
.btn.ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.err{color:var(--loss);font-size:13px}
.foot{font-size:12px;color:var(--ink3);padding:16px 0 4px;display:flex;gap:14px;flex-wrap:wrap}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:4px 8px;border-radius:6px;transform:translate(-50%,-130%);white-space:nowrap;display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app"></div>
<div id="tip" role="presentation"></div>
<script>
(function () {
'use strict';
var PREVIEW = window.MUNSHI_PREVIEW || null;
var H = new URLSearchParams(location.hash.slice(1));
var ls = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del: function (k) { try { localStorage.removeItem(k); } catch (e) {} } };
var embed = H.get('embed') === '1';
var key = H.get('k') || ls.get('munshi_key') || '';
if (H.get('k') && !embed) ls.set('munshi_key', key);
var S = { range: 'today', site: PREVIEW ? 'demo' : 'main', page: H.get('page') || null, data: null, read: null, open: {}, chat: [], busy: false, err: null, firstOpen: true };
var app = document.getElementById('app'), tip = document.getElementById('tip');
var FCLS = { quick: 'fq', glance: 'fg', browsed: 'fb', intent: 'fi', signup: 'fs', paid: 'fp' };
var KIND = { bounce: 'People leaving', slow: 'Slow page', error: 'Broken code', request: 'Failed request', payment: 'Payment', rage: 'Frustration', form: 'Form', broken: 'Page not opening', mobile: 'Phones', source: 'Traffic', funnel: 'Sign-up path' };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function n(x) { return Number(x || 0).toLocaleString('en-IN'); }
function secs(ms) { if (!ms) return '0s'; return ms >= 60000 ? Math.floor(ms / 60000) + 'm ' + Math.round(ms % 60000 / 1000) + 's' : (ms / 1000).toFixed(ms < 10000 ? 1 : 0) + 's'; }
function post(msg) { if (embed && parent !== window) try { parent.postMessage(msg, '*'); } catch (e) {} }
function api(path, opts) {
  opts = opts || {}; opts.headers = Object.assign({ 'x-munshi-key': key }, opts.headers || {});
  return fetch('/api/' + path, opts).then(function (r) { if (r.status === 401) throw new Error('unauthorized'); return r.json(); });
}

function load(quiet) {
  if (PREVIEW) { S.data = PREVIEW.stats[S.range]; S.read = PREVIEW.read[S.range] || null; render(); return; }
  if (!key) return renderSignIn();
  if (!quiet) { S.read = null; }
  var q = 'stats?range=' + S.range + '&site=' + S.site + (S.page && S.site === 'main' ? '&page=' + encodeURIComponent(S.page) : '');
  api(q).then(function (d) {
    S.data = d; S.err = null;
    if (S.firstOpen) { S.firstOpen = false; if (d.issues[0]) S.open[d.issues[0].id] = true; }
    render();
    post({ type: 'munshi:badge', n: S.site === 'main' ? d.issues.filter(function (i) { return i.sev >= 2; }).length : 0 });
    if (d.ai && d.totals.visits >= 5 && !S.read) api('brief?range=' + S.range + '&site=' + S.site).then(function (b) { if (b.text) { S.read = b.text; render(); } }).catch(function () {});
  }).catch(function (e) {
    if (e.message === 'unauthorized') { ls.del('munshi_key'); return renderSignIn('That key was not accepted. Check the link you were given.'); }
    S.err = 'Could not reach Munshi. Check your connection.'; render();
  });
}

function renderSignIn(msg) {
  app.innerHTML = '<div class="center"><h1>Open your analyst</h1><p>Paste your Munshi owner key. It is in the setup link you were given.</p>' +
    '<form id="si"><label class="sr" for="k">Owner key</label><input id="k" autocomplete="off" placeholder="mk_…" required>' +
    (msg ? '<p class="err">' + esc(msg) + '</p>' : '') + '<button class="btn" type="submit">Open Munshi</button></form></div>';
  document.getElementById('si').addEventListener('submit', function (e) { e.preventDefault(); key = document.getElementById('k').value.trim(); ls.set('munshi_key', key); load(); });
}

function header(d) {
  var name = d && d.site && d.site.name ? d.site.name : (H.get('host') || '');
  var seg = [['today', 'Today'], ['yesterday', 'Yesterday'], ['7d', '7 days']].map(function (r) { return '<button type="button" data-range="' + r[0] + '" aria-pressed="' + (S.range === r[0]) + '">' + r[1] + '</button>'; }).join('');
  return '<header class="top"><span class="mark">Munshi</span><span class="site">' + esc(name) + '</span><div class="seg" role="group" aria-label="Period">' + seg + '</div>' +
    (embed ? '<button class="x" type="button" data-act="close" aria-label="Hide Munshi">×</button>' : '') + '</header>';
}

function hero(d) {
  var t = d.totals, total = t.visits || 1, h = '';
  if (d.site.demo) h += '<div class="sample"><span>Sample data, not your site.</span>' + (PREVIEW ? '' : '<button class="link" type="button" data-act="real">Show my site</button>') + '</div>';
  h += '<section>';
  if (d.range === 'today') h += '<div class="live"><span class="dot' + (t.live ? ' on' : '') + '"></span>' + (t.live ? n(t.live) + (t.live === 1 ? ' person' : ' people') + ' on the site now' : 'Nobody on the site right now') + '</div>';
  h += '<h1 class="headline">' + esc(d.brief.headline) + '</h1>';
  if (t.visits) {
    h += '<div class="strip" role="img" aria-label="Where visits ended">' + d.fate.filter(function (f) { return f.n; }).map(function (f) { return '<i class="' + FCLS[f.key] + '" style="flex:' + f.n + ' 1 0" data-tip="' + esc(f.label + ': ' + n(f.n)) + '"></i>'; }).join('') + '</div>';
    h += '<ul class="fates">' + d.fate.map(function (f) { return '<li class="' + (f.n ? '' : 'zero') + '"><span class="sw ' + FCLS[f.key] + '"></span><span>' + esc(f.label) + '</span><b class="num">' + n(f.n) + '</b><span class="p num">' + Math.round(f.n / total * 100) + '%</span></li>'; }).join('') + '</ul>';
    if (S.read) h += '<div class="read"><span class="by">Munshi’s read</span>' + esc(S.read) + '</div>';
    else h += '<ul class="lines">' + d.brief.lines.slice(1).map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>';
  }
  return h + '</section>';
}

function issues(d) {
  if (!d.totals.visits) return '';
  var h = '<section><h2>What to fix <small>' + (d.issues.length ? 'worst first' : '') + '</small></h2>';
  if (!d.issues.length) return h + '<div class="clear"><span class="dot"></span>Nothing is broken or leaking badly in this period.</div></section>';
  h += d.issues.map(function (i) {
    var open = !!S.open[i.id];
    var b = '<div class="issue s' + i.sev + '"><button type="button" aria-expanded="' + open + '" data-issue="' + esc(i.id) + '"><span class="sev"></span><span class="t">' + esc(i.title) + '<span class="tag">' + esc(KIND[i.kind] || '') + (i.page ? ' on ' + esc(i.page) : '') + '</span></span><span class="n num">' + n(i.people) + (i.people === 1 ? ' person' : ' people') + '</span></button>';
    if (open) {
      b += '<div class="body"><p>' + esc(i.detail) + '</p><div class="fix"><b>Do this</b>' + esc(i.fix) + '</div>';
      if (i.evidence && i.evidence.length) b += '<div class="ev">' + i.evidence.map(function (e) { return '<span title="' + esc(e) + '">' + esc(e) + '</span>'; }).join('') + '</div>';
      b += '<div class="acts"><button class="link" type="button" data-askabout="' + esc(i.title) + '">Ask Munshi about this</button>' + (embed && i.page && i.page !== S.page ? '<button class="link" type="button" data-goto="' + esc(i.page) + '">Open ' + esc(i.page) + '</button>' : '') + '</div></div>';
    }
    return b + '</div>';
  }).join('');
  return h + '</section>';
}

function thisPage(d) {
  var f = d.pageFocus; if (!f) return '';
  var h = '<section><h2>The page you are on <small>' + esc(f.path) + '</small></h2>';
  if (!f.row) return h + '<p style="color:var(--ink2);margin:0">No visits to this page in this period.</p></section>';
  var r = f.row;
  h += '<div class="kv"><div><b class="num">' + n(r.views) + '</b><span>views</span></div><div><b class="num">' + (r.entries ? r.quickPct + '%' : 'n/a') + '</b><span>of people landing here leave within 5 seconds</span></div><div><b class="num">' + secs(r.time) + '</b><span>typical time here</span></div><div><b class="num">' + (r.scroll || 0) + '%</b><span>how far down they scroll</span></div></div>';
  if (r.lcpN) h += '<p class="cap">Shows its main content in ' + secs(r.lcp) + (r.lcp > 4000 ? ', which is slow.' : r.lcp > 2500 ? ', which is acceptable.' : ', which is fast.') + '</p>';
  if (f.clicks.length) h += '<p class="cap">What they click</p><ul class="mini">' + f.clicks.map(function (c) { return '<li><span class="l">' + esc(c.label) + '</span><span class="num">' + n(c.n) + '</span></li>'; }).join('') + '</ul>';
  if (f.next.length) h += '<p class="cap">Where they go next</p><ul class="mini">' + f.next.map(function (c) { return '<li><span class="l">' + esc(c.path) + '</span><span class="num">' + n(c.n) + '</span></li>'; }).join('') + '</ul>';
  if (f.errors || f.rage) h += '<p class="cap">' + (f.errors ? n(f.errors) + ' code error' + (f.errors === 1 ? '' : 's') + ' here. ' : '') + (f.rage ? n(f.rage) + ' frustrated click burst' + (f.rage === 1 ? '' : 's') + ' here.' : '') + '</p>';
  return h + '</section>';
}

function chart(d) {
  if (!d.totals.visits) return '';
  var pts = d.series.points, max = Math.max.apply(null, pts.map(function (p) { return p.visits; })) || 1;
  var hourly = d.series.unit === 'hour';
  function hr(h) { return (h % 12 || 12) + (h < 12 ? 'am' : 'pm'); }
  function dl(k) { var p = k.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', timeZone: 'UTC' }); }
  var bars = pts.map(function (p, i) {
    var future = hourly && d.series.nowHour != null && i > d.series.nowHour;
    var label = (hourly ? hr(i) + ' to ' + hr((i + 1) % 24) : dl(p.label)) + ': ' + n(p.visits) + ' visit' + (p.visits === 1 ? '' : 's') + (p.conv ? ', ' + p.conv + ' converted' : '');
    return '<div class="c' + (future ? ' f' : '') + '" data-tip="' + esc(future ? hr(i) + ': not yet' : label) + '"><i style="height:' + (future ? 0 : Math.max(p.visits ? 3 : 0, Math.round(p.visits / max * 100))) + '%"></i>' + (p.conv ? '<u></u>' : '') + '</div>';
  }).join('');
  var axis = hourly ? '<span>12am</span><span>6am</span><span>12pm</span><span>6pm</span><span>11pm</span>' : '<span>' + esc(dl(pts[0].label)) + '</span><span>' + esc(dl(pts[pts.length - 1].label)) + '</span>';
  var conv = pts.some(function (p) { return p.conv; });
  return '<section><h2>' + (hourly ? 'Visits by hour' : 'Visits by day') + ' <small>busiest: ' + n(max) + '</small></h2><div class="chart">' + bars + '</div><div class="axis">' + axis + '</div>' + (conv ? '<div class="key"><u></u>someone signed up or paid</div>' : '') + '</section>';
}

function trend(d) {
  if (!d.trend || d.range === '7d') return '';
  var pts = d.trend, max = Math.max.apply(null, pts.map(function (p) { return p.visits; })) || 0;
  if (!max) return '';
  function dl(k) { var p = k.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }); }
  var bars = pts.map(function (p) { return '<div class="c" data-tip="' + esc(dl(p.day) + ': ' + n(p.visits) + ' visits, ' + (p.signups + p.paid) + ' converted') + '"><i style="height:' + Math.max(p.visits ? 3 : 0, Math.round(p.visits / max * 100)) + '%"></i>' + (p.signups + p.paid ? '<u></u>' : '') + '</div>'; }).join('');
  return '<section><h2>Last 14 days <small>visits per day</small></h2><div class="chart" style="height:64px">' + bars + '</div><div class="axis"><span>' + esc(dl(pts[0].day)) + '</span><span>today</span></div></section>';
}

function tables(d) {
  if (!d.totals.visits) return '';
  var h = '<section><h2>Where visitors come from</h2><table><thead><tr><th scope="col">Source</th><th scope="col">Visits</th><th scope="col">Left in 5s</th><th scope="col">Converted</th></tr></thead><tbody>' +
    d.sources.slice(0, 7).map(function (s) { return '<tr><td title="' + esc(s.name) + '">' + esc(s.name) + '</td><td class="num">' + n(s.visits) + '</td><td class="num' + (s.quickPct >= 70 && s.visits >= 10 ? ' bad' : '') + '">' + s.quickPct + '%</td><td class="num' + (s.conv ? ' good' : '') + '">' + n(s.conv) + '</td></tr>'; }).join('') + '</tbody></table></section>';
  h += '<section><h2>Pages</h2><table><thead><tr><th scope="col">Page</th><th scope="col">Views</th><th scope="col">Left in 5s</th><th scope="col">Time</th></tr></thead><tbody>' +
    d.pages.slice(0, 8).map(function (p) { return '<tr><td title="' + esc(p.path) + '">' + esc(p.path) + '</td><td class="num">' + n(p.views) + '</td><td class="num' + (p.quickPct >= 70 && p.entries >= 8 ? ' bad' : '') + '">' + (p.entries ? p.quickPct + '%' : 'n/a') + '</td><td class="num">' + secs(p.time) + '</td></tr>'; }).join('') + '</tbody></table></section>';
  h += '<section><h2>Devices</h2><table><thead><tr><th scope="col">Device</th><th scope="col">Visits</th><th scope="col">Left in 5s</th><th scope="col">Converted</th></tr></thead><tbody>' +
    d.devices.map(function (s) { return '<tr><td>' + esc(s.name) + '</td><td class="num">' + n(s.visits) + '</td><td class="num">' + s.quickPct + '%</td><td class="num' + (s.conv ? ' good' : '') + '">' + n(s.conv) + '</td></tr>'; }).join('') + '</tbody></table></section>';
  return h;
}

function empty(d) {
  if (d.totals.visits || d.site.demo) return '';
  if (d.site.everSeen) return '';
  return '<section><h2>Munshi is not receiving visits yet</h2><p style="color:var(--ink2);margin:0 0 14px">Once the tracking line is on your website, visits show up here within seconds. Your own visits are not counted.</p><div class="acts"><a class="btn" href="/setup#k=' + encodeURIComponent(key) + '" target="_blank" rel="noopener">Open setup steps</a><button class="btn ghost" type="button" data-act="demo">See it with sample data</button></div></section>';
}

function chat() {
  if (!S.chat.length) return '';
  return '<section class="chat" id="chat"><h2>Your questions</h2>' + S.chat.map(function (c) {
    return '<div class="q">' + esc(c.q) + '</div>' + (c.note ? '<p class="note">' + esc(c.note) + '</p>' : '') + '<div class="a' + (c.a ? '' : ' wait') + '">' + esc(c.a || 'Looking at your visitors…') + '</div>';
  }).join('') + '</section>';
}

function render() {
  var d = S.data;
  if (!d) { app.innerHTML = header(null) + '<main><section><p style="color:var(--ink2)">' + esc(S.err || 'Loading…') + '</p></section></main>'; return; }
  var keep = document.getElementById('q'), val = keep ? keep.value : '', focused = keep && document.activeElement === keep;
  var left = hero(d) + empty(d) + issues(d) + chat();
  var right = thisPage(d) + chart(d) + tables(d) + trend(d);
  var foot = '<div class="foot"><span>Updated ' + new Date(d.generatedAt).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }) + '</span>' +
    (PREVIEW ? '' : (d.site.demo ? '' : '<button class="link" type="button" data-act="demo">Sample data</button>') + '<a class="link" href="/setup#k=' + encodeURIComponent(key) + '" target="_blank" rel="noopener">Setup</a>' + (embed ? '<a class="link" href="/panel#k=' + encodeURIComponent(key) + '" target="_blank" rel="noopener">Full screen</a><button class="link" type="button" data-act="signout">Hide on this browser</button>' : '')) + '</div>';
  var chips = ['What should I fix first?', 'Why is nobody signing up?', 'Which traffic is worth my time?', 'How do phone visitors compare?'];
  app.innerHTML = header(d) + '<main><div class="cols"><div>' + left + '</div><div>' + right + foot + '</div></div></main>' +
    '<div class="ask"><div class="in"><div class="chips">' + chips.map(function (c) { return '<button type="button" data-chip="' + esc(c) + '">' + esc(c) + '</button>'; }).join('') + '</div>' +
    '<form id="askf"><label class="sr" for="q">Ask about your visitors</label><input id="q" placeholder="Ask about your visitors" autocomplete="off" maxlength="400"><button class="send" type="submit"' + (S.busy ? ' disabled' : '') + '>Ask</button></form></div></div>';
  var q = document.getElementById('q'); q.value = val; if (focused) q.focus();
}

function ask(text) {
  text = String(text || '').trim(); if (!text || S.busy) return;
  var entry = { q: text, a: null }; S.chat.push(entry); S.busy = true; render();
  var el = document.getElementById('chat'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'end' });
  function done() { S.busy = false; render(); var e2 = document.getElementById('chat'); if (e2) e2.scrollIntoView({ block: 'end' }); }
  if (PREVIEW) { entry.note = 'This is a preview with sample data.'; entry.a = PREVIEW.answers[text] || 'Questions are answered from your real visitor data once Munshi is live on your site. Try one of the suggested questions to see an example.'; return done(); }
  var history = []; S.chat.slice(0, -1).slice(-3).forEach(function (c) { if (c.a) { history.push({ role: 'user', content: c.q }); history.push({ role: 'assistant', content: c.a }); } });
  api('ask', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ q: text, range: S.range, site: S.site, page: S.page, history: history }) }).then(function (r) {
    if (r.answer) entry.a = r.answer;
    else { entry.note = r.reason === 'no_model' ? 'The AI connection is not set up yet, so here is the written summary instead.' : 'The AI did not answer just now, so here is the written summary instead.'; entry.a = r.fallback || 'No answer available.'; }
    done();
  }).catch(function () { entry.a = 'Could not reach Munshi. Try again.'; done(); });
}

app.addEventListener('click', function (e) {
  var t = e.target.closest('button,[data-act]'); if (!t) return;
  if (t.dataset.range) { S.range = t.dataset.range; S.read = null; load(); }
  else if (t.dataset.issue) { S.open[t.dataset.issue] = !S.open[t.dataset.issue]; render(); var b = app.querySelector('[data-issue="' + CSS.escape(t.dataset.issue) + '"]'); if (b) b.focus(); }
  else if (t.dataset.chip) ask(t.dataset.chip);
  else if (t.dataset.askabout) ask('Tell me more about this and exactly how to fix it: ' + t.dataset.askabout);
  else if (t.dataset.goto) post({ type: 'munshi:goto', path: t.dataset.goto });
  else if (t.dataset.act === 'close') post({ type: 'munshi:close' });
  else if (t.dataset.act === 'demo') { S.site = 'demo'; S.read = null; S.open = {}; S.firstOpen = true; load(); }
  else if (t.dataset.act === 'real') { S.site = 'main'; S.read = null; S.open = {}; S.firstOpen = true; load(); }
  else if (t.dataset.act === 'signout') { if (confirm('Hide Munshi on this browser? Your visits will be counted like any visitor until you open your owner link again.')) post({ type: 'munshi:signout' }); }
});
app.addEventListener('submit', function (e) { if (e.target.id === 'askf') { e.preventDefault(); var q = document.getElementById('q'); var v = q.value; q.value = ''; ask(v); } });
app.addEventListener('pointerover', function (e) { var t = e.target.closest('[data-tip]'); if (!t) { tip.style.display = 'none'; return; } var r = t.getBoundingClientRect(); tip.textContent = t.dataset.tip; tip.style.display = 'block'; tip.style.left = Math.min(window.innerWidth - 90, Math.max(90, r.left + r.width / 2)) + 'px'; tip.style.top = r.top + 'px'; });
app.addEventListener('pointerleave', function () { tip.style.display = 'none'; });
window.addEventListener('message', function (e) { if (e.data && e.data.type === 'munshi:page' && typeof e.data.path === 'string') { S.page = e.data.path; load(true); } });
setInterval(function () { if (!PREVIEW && key && document.visibilityState === 'visible' && !S.busy) load(true); }, 60000);
if (PREVIEW && PREVIEW.stats.today.issues[0]) S.open[PREVIEW.stats.today.issues[0].id] = true;
load();
})();
</script>
</body>
</html>
