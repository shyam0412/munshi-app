<!doctype html><html><head><title>Sign up</title><script async src="http://localhost:4100/m.js"></script></head>
<body style="font-family:sans-serif"><form id="f"><h2>Create your account</h2>
<label>Email <input name="email" type="email"></label><label>Phone number <input name="phone"></label><label>Password <input name="pw" type="password"></label>
<button type="submit">Sign up</button></form>
<script>document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();fetch(new URLSearchParams(location.search).get('fail')?'/api/signup':'/api/ok',{method:'POST'}).then(function(r){if(r.ok)location.href='/welcome';});});</script></body></html>
